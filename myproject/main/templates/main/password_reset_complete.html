{% extends 'main/base_eduflow.html' %}
{% block title %}密碼已重設 | EduFlow{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-10 text-center">
    <div class="text-5xl mb-3">✅</div>
    <h1 class="text-2xl font-black text-slate-900 mb-2">密碼已重設</h1>
    <p class="text-slate-500 mb-6">你的新密碼已經生效，現在可以用它登入了。</p>
    <a href="{% url 'login' %}" class="inline-block bg-brand-600 hover:bg-brand-700 text-white font-bold px-6 py-3 rounded-lg transition">前往登入</a>
  </div>
</main>
{% endblock %}
