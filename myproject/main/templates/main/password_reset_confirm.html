{% extends 'main/base_eduflow.html' %}
{% block title %}設定新密碼 | EduFlow{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 py-14">
  <div class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-8">
    {% if validlink %}
    <h1 class="text-2xl font-black text-slate-900 mb-1">設定新密碼</h1>
    <p class="text-slate-500 mb-6">請輸入兩次相同的新密碼，完成後就能用它登入。</p>
    <div class="ef-form">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-lg transition mt-2">設定新密碼</button>
      </form>
    </div>
    {% else %}
    <div class="text-center">
      <div class="text-5xl mb-3">⚠️</div>
      <h1 class="text-2xl font-black text-slate-900 mb-2">連結已失效</h1>
      <p class="text-slate-500 mb-6">這個重設連結無效或已經使用過。請重新申請一次。</p>
      <a href="{% url 'password_reset' %}" class="inline-block bg-brand-600 hover:bg-brand-700 text-white font-bold px-5 py-2.5 rounded-lg transition">重新申請</a>
    </div>
    {% endif %}
    <a href="{% url 'login' %}" class="block text-center text-brand-600 hover:underline text-sm mt-4">← 回登入頁</a>
  </div>
</main>
{% endblock %}
