{% extends 'main/base_eduflow.html' %}
{% block title %}購買成功 | EduFlow{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 py-16">
  <div class="bg-satdark-surface rounded-2xl ring-1 ring-satdark-border shadow-sm p-10 text-center">
    <div class="text-5xl mb-3">✅</div>
    <h1 class="text-2xl font-black text-satdark-text mb-2">購買成功</h1>
    <p class="text-satdark-muted mb-6">你已成功購買課程：<strong class="text-satdark-text">{{ course.title }}</strong></p>
    <div class="flex gap-3 justify-center flex-wrap">
      <a href="{% url 'my_courses' %}" class="bg-jp-primary hover:bg-jp-primaryHover text-white font-bold px-6 py-3 rounded-lg transition">我的課程</a>
      <a href="{% url 'home' %}" class="bg-white/10 hover:bg-white/20 text-satdark-text font-bold px-6 py-3 rounded-lg transition">回首頁</a>
    </div>
  </div>
</main>
{% endblock %}
