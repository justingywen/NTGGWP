<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduFlow 線上購課平台{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e6fbf6', 100: '#c3f4e9', 200: '#8fe9d6', 300: '#54d8be',
                            400: '#22c2a5', 500: '#0fa88d', 600: '#0c8f78', 700: '#0b7362',
                            800: '#0d5b4f', 900: '#0c4a41',
                        },
                        accent: {
                            50: '#fff7ed', 100: '#ffedd5', 300: '#fdba74',
                            400: '#fbbf24', 500: '#f59e0b', 600: '#d97706',
                        },
                        jp: {
                            bg: '#0a0e14',
                            surface: '#12161f',
                            border: '#242b38',
                            text: '#e8ecf8',
                            muted: '#aab2c7',
                            primary: '#16c2a3',
                            primaryHover: '#0fa588',
                            accent: '#fbbf24',
                        },
                        satdark: {
                            bg: '#030303',
                            surface: '#17191c',
                            border: '#2a2d31',
                            text: '#ffffff',
                            muted: '#9a9a9a',
                        },
                        electric: {
                            DEFAULT: '#16c2a3',
                            hover: '#0fa588',
                        },
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Inter"', 'system-ui', 'sans-serif'],
                        display: ['"Fraunces"', '"Noto Sans TC"', 'serif'],
                        ticket: ['"IBM Plex Mono"', 'monospace'],
                        grotesk: ['"Hanken Grotesk"', '"Noto Sans TC"', 'sans-serif'],
                    },
                    keyframes: {
                        'float': { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-12px)' } },
                        'fade-up': { '0%': { opacity: 0, transform: 'translateY(16px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                    },
                    animation: { 'float': 'float 6s ease-in-out infinite', 'fade-up': 'fade-up 0.6s ease-out both' },
                },
            },
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@500;600&family=Hanken+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        html { scroll-behavior: smooth; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .group:hover img.zoom { transform: scale(1.05); }
        img.zoom { transition: transform 0.4s ease-in-out; }
        [data-dropdown-menu]:not(.hidden) { animation: dropdown-in 0.18s ease-out both; }
        @keyframes dropdown-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        .ef-form input:not([type=checkbox]):not([type=radio]):not([type=file]),
        .ef-form select, .ef-form textarea {
            width: 100%; border: 1px solid #2a3242; border-radius: 0.7rem;
            padding: 0.65rem 0.85rem; font-size: 0.95rem; background: #0f1420; color: #e8ecf8;
            transition: border-color .15s, box-shadow .15s;
        }
        .ef-form input::placeholder, .ef-form textarea::placeholder { color: #7c869c; }
        .ef-form input:focus, .ef-form select:focus, .ef-form textarea:focus {
            outline: none; border-color: #16c2a3; box-shadow: 0 0 0 3px rgba(22,194,163,.20);
        }
        .ef-form textarea { resize: vertical; min-height: 6.5rem; }
        .ef-form label { font-weight: 700; color: #aab2c7; display: block; margin: 0.8rem 0 0.4rem; }
        .ef-form p { margin-bottom: 0.9rem; }
        .ef-form ul.errorlist { color: #ff9b9b; font-size: 0.85rem; list-style: none; padding: 0; margin: 0.25rem 0; }
        .ef-form .helptext { color: #7c869c; font-size: 0.8rem; }
        .ef-form input[type=file] { font-size: 0.9rem; color: #aab2c7; }
        .ef-form input[type=checkbox], .ef-form input[type=radio] { accent-color: #16c2a3; width: 1rem; height: 1rem; vertical-align: middle; }


        .bg-white, .bg-gray-50, .bg-gray-100, .bg-slate-50 {
            background-color: #12161f !important;
        }
        .bg-slate-100, .bg-slate-200, .bg-gray-200 {
            background-color: #1b2130 !important;
        }
        .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800,
        .text-slate-700, .text-gray-700 {
            color: #e8ecf8 !important;
        }
        .text-slate-600, .text-gray-600, .text-slate-500, .text-gray-500,
        .text-slate-400, .text-gray-400 {
            color: #aab2c7 !important;
        }
        .border-slate-100, .border-slate-200, .border-gray-100, .border-gray-200 {
            border-color: #242b38 !important;
        }

        .bg-red-50 { background-color: rgba(248,113,113,.12) !important; }
        .bg-green-50, .bg-emerald-50 { background-color: rgba(52,211,153,.12) !important; }
        .bg-amber-50, .bg-yellow-50 { background-color: rgba(251,191,36,.12) !important; }
        .bg-blue-50, .bg-indigo-50 { background-color: rgba(96,165,250,.12) !important; }
        .bg-rose-50 { background-color: rgba(251,113,133,.12) !important; }
        .hover\:bg-rose-50:hover { background-color: rgba(251,113,133,.18) !important; }
        .text-rose-600 { color: #fda4af !important; }

        .bg-brand-50, .bg-brand-100 { background-color: rgba(22,194,163,.14) !important; }
        .hover\:bg-brand-50:hover, .hover\:bg-brand-100:hover { background-color: rgba(22,194,163,.22) !important; }
        .text-red-600, .text-red-700 { color: #ff9b9b !important; }
        .text-green-600, .text-green-700, .text-emerald-700 { color: #6ee7b7 !important; }
        .text-amber-600, .text-amber-700 { color: #fcd34d !important; }
        .text-blue-600, .text-blue-700, .text-indigo-600, .text-indigo-700 { color: #93c5fd !important; }


        .btn-glass, .btn-glass-primary {
            position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            border-radius: 0.5rem; font-weight: 700; cursor: pointer;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }
        .btn-glass:hover, .btn-glass-primary:hover { transform: translateY(-1px); }
        .btn-glass:active, .btn-glass-primary:active { transform: translateY(0); }

        .btn-glass {
            color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.35);
        }
        .btn-glass:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.55); }

        .btn-glass-primary {
            color: #04110f; background: #16c2a3; border: 1px solid #16c2a3;
        }
        .btn-glass-primary:hover { background: #1bd9b7; border-color: #1bd9b7; }

        .glass-arrow {
            height: 2.75rem; width: 2.75rem; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 0.5rem; color: #fff; cursor: pointer;
            border: 1px solid rgba(255,255,255,.25);
            background: rgba(10,14,20,.75);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }
        .glass-arrow:hover { background: rgba(22,194,163,.25); border-color: #16c2a3; transform: translateY(-1px); }
        .glass-arrow:active { transform: translateY(0); }
        .glass-arrow:disabled { opacity: .35; cursor: not-allowed; transform: none; }


        .text-tight-head { letter-spacing: -0.02em; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-jp-bg font-sans text-jp-text antialiased">

    {% include 'main/partials/eduflow_navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'main/partials/eduflow_footer.html' %}


    <button data-back-to-top class="fixed bottom-6 right-6 z-40 h-12 w-12 rounded-full bg-jp-primary text-white shadow-lg shadow-brand-600/30 hover:bg-jp-primaryHover transition opacity-0 invisible" aria-label="回到頂部">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-close]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const t = document.querySelector(btn.dataset.close);
                if (t) t.remove();
            });
        });

        document.querySelectorAll('[data-search-toggle]').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-search-panel]').forEach((panel) => {
                    panel.classList.toggle('hidden');
                    if (!panel.classList.contains('hidden')) {
                        const input = panel.querySelector('input[name="q"]');
                        if (input) input.focus();
                    }
                });
            });
        });

        document.querySelectorAll('[data-dropdown-wrapper]').forEach((wrapper) => {
            const toggle = wrapper.querySelector('[data-dropdown-toggle]');
            const menu = wrapper.querySelector('[data-dropdown-menu]');
            const caret = wrapper.querySelector('[data-dropdown-caret]');
            if (!toggle || !menu) return;
            const close = () => { menu.classList.add('hidden'); caret && caret.classList.remove('rotate-180'); };
            const open = () => { menu.classList.remove('hidden'); caret && caret.classList.add('rotate-180'); };
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.contains('hidden') ? open() : close();
            });
            document.addEventListener('click', (e) => {
                if (!wrapper.contains(e.target)) close();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') close();
            });
        });

        const mobileMenu = document.querySelector('[data-mobile-menu]');
        const openMobile = () => mobileMenu && mobileMenu.classList.remove('hidden');
        const closeMobile = () => mobileMenu && mobileMenu.classList.add('hidden');
        document.querySelectorAll('[data-mobile-toggle]').forEach((b) => b.addEventListener('click', openMobile));
        document.querySelectorAll('[data-mobile-close]').forEach((b) => b.addEventListener('click', closeMobile));
        mobileMenu && mobileMenu.querySelectorAll('a').forEach((a) => a.addEventListener('click', closeMobile));

        document.querySelectorAll('[data-carousel]').forEach((track) => {
            const name = track.dataset.carousel;
            const prevBtn = document.querySelector(`[data-carousel-prev="${name}"]`);
            const nextBtn = document.querySelector(`[data-carousel-next="${name}"]`);
            const step = () => Math.max(track.clientWidth * 0.8, 300);
            const updateButtons = () => {
                const EDGE = 4;
                const maxScroll = track.scrollWidth - track.clientWidth - EDGE;
                if (prevBtn) prevBtn.disabled = track.scrollLeft <= EDGE;
                if (nextBtn) nextBtn.disabled = track.scrollLeft >= maxScroll;
            };
            prevBtn && prevBtn.addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
            nextBtn && nextBtn.addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
            track.addEventListener('scroll', updateButtons, { passive: true });
            window.addEventListener('resize', updateButtons);
            updateButtons();
        });

        const navbar = document.getElementById('navbar');
        const backToTop = document.querySelector('[data-back-to-top]');
        const onScroll = () => {
            const y = window.scrollY;
            navbar && navbar.classList.toggle('shadow-md', y > 8);
            if (backToTop) {
                const show = y > 400;
                backToTop.classList.toggle('opacity-0', !show);
                backToTop.classList.toggle('invisible', !show);
            }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        backToTop && backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
