{% extends 'main/base_eduflow.html' %}
{% block title %}登入 | EduFlow{% endblock %}

{% block content %}
<style>

  .glass-login {
    --g-text: #e8ecf8;
    --g-muted: #aab2c7;
    --g-border: hsl(0 0% 100% / 0.28);
    min-height: calc(100vh - 4rem);
    display: grid;
    place-items: center;
    padding: 2.5rem 1rem;
    color: var(--g-text);

    background:
      linear-gradient(180deg, hsl(180 25% 5% / 0.62), hsl(200 30% 4% / 0.78)),
      url('/media/site/auth-bg.jpg') center 65% / cover no-repeat;
  }
  .glass-card {
    width: min(27rem, 100%);
    border-radius: 1.25rem;
    padding: 2.25rem;
    background: hsl(225 24% 13% / 0.35);
    border: 1px solid var(--g-border);
    box-shadow: 0 1.25rem 2.81rem hsl(0 0% 0% / 0.45);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
  }
  .glass-card h1 { color: #fff; }
  .glass-card .g-sub, .glass-card label, .glass-card .g-muted { color: var(--g-muted); }
  .glass-input {
    width: 100%;
    border-radius: 0.75rem;
    border: 1px solid hsl(0 0% 100% / 0.22);
    background: hsl(222 29% 7% / 0.6);
    color: var(--g-text);
    padding: 0.7rem 0.85rem;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .glass-input::placeholder { color: #7c869c; }
  .glass-input:focus {
    border-color: hsl(172 70% 55% / 0.8);
    box-shadow: 0 0 0 3px hsl(172 70% 55% / 0.18);
  }
  .glass-btn {
    width: 100%;
    border: 0;
    border-radius: 0.75rem;
    padding: 0.8rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    color: #04110f;
    background: linear-gradient(135deg, hsl(168 75% 55%), hsl(190 75% 55%));
    transition: filter .15s, transform .05s;
  }
  .glass-btn:hover { filter: brightness(1.08); }
  .glass-btn:active { transform: translateY(1px); }
  .glass-oauth {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    width: 100%; padding: 0.65rem; border-radius: 0.75rem;
    border: 1px solid var(--g-border); color: var(--g-text);
    background: hsl(0 0% 100% / 0.04); transition: background .15s;
  }
  .glass-oauth:hover { background: hsl(0 0% 100% / 0.1); }
  .glass-link { color: hsl(172 70% 62%); }
  .glass-link:hover { text-decoration: underline; }

  .glass-sep {
    height: 7px;
    background-image: linear-gradient(90deg, hsl(0 0% 100% / .3) 1px, transparent 1px);
    background-size: 11px 100%;
    background-position: center;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 45%, #000 55%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 45%, #000 55%, transparent);
  }
</style>

<section class="glass-login">
  <div class="glass-card">
    <h1 class="font-display italic text-3xl font-medium mb-1">登入</h1>
    <p class="g-sub mb-6 text-sm">輸入帳號名稱或 Gmail 與密碼登入平台。</p>

    {% if error_message %}
    <div class="mb-5 text-sm font-medium px-4 py-3 rounded-lg" style="background:hsl(0 70% 55% / 0.15);color:#ffb4b4;border:1px solid hsl(0 70% 60% / 0.3)">{{ error_message }}</div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block font-medium mb-1.5 text-sm" for="username">帳號名稱或 Gmail</label>
        <input type="text" id="username" name="username" placeholder="請輸入帳號名稱或 Gmail" required autocomplete="username" class="glass-input">
      </div>
      <div>
        <label class="block font-medium mb-1.5 text-sm" for="password">密碼</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" class="glass-input">
      </div>
      <button type="submit" class="glass-btn">登入</button>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="glass-sep flex-1"></div>
      <span class="text-xs g-muted">或使用快速登入</span>
      <div class="glass-sep flex-1"></div>
    </div>
    <div class="space-y-3">
      <a href="{% url 'google_login' %}" class="glass-oauth"><span>使用 Google 登入</span></a>
    </div>

    <div class="flex items-center justify-between mt-5 text-sm">
      <a href="{% url 'password_reset' %}" class="glass-link">忘記密碼？</a>
      <a href="{% url 'register' %}" class="g-muted hover:text-white transition">還沒有帳號？免費註冊</a>
    </div>
  </div>
</section>
{% endblock %}
